<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your profile</title>
    <link rel="stylesheet" href="css/index2.css">
</head>
<body>

    <main class="cards-container">
        <div class="card card-caregiver">
            <div class="card-icon">👤</div>
            <h2>I want to be a caregiver</h2>
            <p>Sign up to offer your services, help those who need it most, and find job opportunities.</p>
            <button class="btn">Apply</button>
        </div>

        <div class="card card-seeker">
            <div class="card-icon">🏡</div>
            <h2>I'm looking for a caregiver</h2>
            <p>Find the ideal professional to take care of your loved ones with the trust and safety you deserve.</p>
            <button class="btn">Look for help</button>
        </div>
    </main>

</body>
</html>
